<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>FUSION Sphere</title>
    <script>
      // Apply color mode before paint. Default is dark; honor an explicit toggle.
      ;(function () {
        try {
          var key = 'fusion-color-mode-v2'
          var stored = localStorage.getItem(key)
          var mode = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
          if (mode === 'dark') {
            document.documentElement.classList.add('fusion-theme-dark')
            document.documentElement.classList.remove('ds-base--inverse')
          } else {
            document.documentElement.classList.remove('fusion-theme-dark', 'ds-base--inverse')
          }
        } catch (e) {}
      })()
    </script>
    <script>
      // Prep page for screenshots / Figma capture: reveal scroll sections early.
      ;(function () {
        var q = location.search
        var h = location.hash.toLowerCase()
        var capture =
          /[?&](screenshot|capture|figma-capture)(=|&|$)/.test(q) ||
          h.indexOf('screenshot') !== -1 ||
          h.indexOf('figmacapture') !== -1
        if (!capture) return
        document.documentElement.classList.add('figma-capture')
        function revealAll() {
          document
            .querySelectorAll('.fusion-reveal, .fusion-reveal-stagger, .fusion-section-reveal')
            .forEach(function (el) {
              el.setAttribute('data-revealed', 'true')
            })
        }
        revealAll()
        window.addEventListener('load', function () {
          revealAll()
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event('resize'))
          })
        })
      })()
    </script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
