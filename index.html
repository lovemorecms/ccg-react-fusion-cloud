<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>FUSION Sphere</title>
    <script>
      // Prep homepage for Figma MCP capture: reveal scroll sections + settle layout.
      ;(function () {
        if (!/#figmacapture=/.test(location.hash)) return
        document.documentElement.classList.add('figma-capture')
        window.addEventListener('load', function () {
          document.querySelectorAll('.fusion-reveal, .fusion-reveal-stagger').forEach(function (el) {
            el.setAttribute('data-revealed', 'true')
          })
          // Nudge layout after images load (ecosystem orbit + tiles).
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event('resize'))
          })
        })
      })()
    </script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
